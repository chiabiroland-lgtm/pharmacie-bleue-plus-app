name: Build Android APK & App Bundle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Sync Capacitor
        run: |
          node copy-www.js
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK (Immediate Installable)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/PharmacieBleuePlus-v1.0-debug.apk

      - name: Build Android Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace || true
          cd ..
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/PharmacieBleuePlus-v1.0-release-unsigned.apk
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab build-artifacts/PharmacieBleuePlus-v1.0.aab
          fi

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PharmacieBleuePlus-Android-Builds
          path: build-artifacts/
          retention-days: 30

      - name: Create GitHub Release with APK on tag or manual dispatch
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
